  if (typeof window.ResizeObserver === 'function') new window.ResizeObserver(applyWidths).observe(surface);

  root.addEventListener('sch-workflow-scene',event => updateScene(event.detail || {}));
  if (globalThis.Tweak) { const tweak = new Tweak({ container: root, onChange: () => updateScene(scene) }); tweak.addSelect(scene,'connection',{ label: '演示连接状态', options: [{label:'已连接',value:'connected'},{label:'首次登录',value:'logged_out'},{label:'打开应用恢复会话',value:'restoring'},{label:'断线重连',value:'reconnecting'},{label:'会话失效',value:'expired'},{label:'连接成功但只在本次保存',value:'session_only'}] }); tweak.addSelect(scene,'writeResult',{ label:'演示成就写入结果', options:[{label:'完成',value:'complete'},{label:'结果未知',value:'unknown'}] }); tweak.addSelect(scene,'aiResult',{ label:'演示生成结果', options:[{label:'完成',value:'complete'},{label:'失败并保留正文',value:'failed'}] }); }
