  function render() {
    const g = currentGame(), group = currentGroup(); savedRange = null;
    surface.innerHTML = `<header class="w-top"><span class="w-strong">Steam Curator Hub</span><span class="w-small">交互草图 · 示例游戏与运行</span><span class="w-grow"></span>${button('account', '演示账号 · 已连接')}${button('settings', '设置')}</header>${state.account ? '<div class="w-main w-small">演示账号 · 会话已保存。真实认证仍由本人验收；这里没有登录 Steam。</div>' : ''}${state.settings ? '<div class="w-main w-small">群组尾巴在正文外独立组合；Gemini、搜索、凭据和恢复采用统一设置入口。本草图不读取或保存密钥。</div>' : ''}<div class="w-body"><aside class="w-games"><h3>我的游戏</h3>${button('search', state.search ? '收起查找' : '查找游戏')}${state.search ? '<p class="w-small w-rule">浏览查找结果保留当前编辑上下文；选择进入才切换工作台。</p>' : ''}<div class="w-rule">${games.map(item => `<button type="button" class="w-game cursor-interaction" data-action="game" data-game="${item.id}" aria-pressed="${state.game === item.id}">${item.title}<span class="w-small">${item.phase}</span></button>`).join('')}</div></aside>${divider('games', '拖拽调整游戏列表宽度')}<main class="w-main"><div class="w-row"><div class="w-grow"><h2>${g.title}</h2><p class="w-small">AppID ${g.appId} · ${group.name}</p></div><label class="w-small">文章语言 <select data-language aria-label="文章语言"><option value="schinese" ${state.language === 'schinese' ? 'selected' : ''}>简体中文</option><option value="english" ${state.language === 'english' ? 'selected' : ''}>English</option></select></label></div><nav class="w-tabs" aria-label="当前游戏的功能">${[['overview','概览与运行'],['achievements','成就 / 统计'],['writing','研究与写作'],['publication','发布准备']].map(([id,title]) => button('tab', title, `data-tab="${id}" aria-pressed="${state.tab === id}"`)).join('')}</nav>${state.tab === 'writing' ? `<div class="w-writing ${state.sourcesOpen ? 'w-open' : ''}">${authorPanel()}${state.sourcesOpen ? divider('sources', '拖拽调整资料面板宽度') + sourcePanel() : ''}</div>` : secondaryPanel()}</main></div><footer class="w-tray"><div class="w-row"><span class="w-strong">并行运行 · ${state.running.size} 款</span><span class="w-grow"></span>${button('run-details', state.runDetails ? '收起时长详情' : '时长详情')}</div>${games.filter(item => state.running.has(item.id)).map(item => `<span class="w-run"><span>${item.title}</span><span class="w-small">运行请求中</span>${button('stop', '单停', `data-game="${item.id}" aria-label="单独停止${item.title}"`)}</span>`).join('') || '<span class="w-small">没有运行中的游戏；按每款手动启动。</span>'}${state.runDetails ? `<p class="w-small w-rule">${games.filter(item => state.running.has(item.id)).map(item => `${item.title}：Steam 上次 ${item.minutes} 分钟 / 本机本次 15 分钟`).join('；')}</p>` : ''}</footer><div class="w-status" role="status" aria-live="polite">${g.title} · ${group.name} · ${languageName()} · ${kindName(state.kind)} · ${state.running.size} 款并行</div>`;
    applyWidths();
  }
  function captureEditor() {
    const editor = surface.querySelector('[data-editor]'); if (!editor) return;
    const d = currentDraft(); d.html = state.kind === 'long' ? safeHtml(editor.innerHTML) : esc(plainText(editor).trimEnd()); d.text = plainText(editor).trimEnd(); d.revision++;
    const save = surface.querySelector('[data-save-state]'); if (save) save.textContent = `本次草图已保留 · 版本 ${d.revision + 1}`;
    const count = surface.querySelector('[data-count]'); if (count) count.textContent = `${Array.from(d.text).length}${state.kind === 'short' ? ' / 199 字' : ' 字'}`;
    const warning = surface.querySelector('[data-short-warning]'); if (warning) warning.hidden = Array.from(d.text).length < 200;
    const s = state.suggestions[docKey()], label = surface.querySelector('[data-suggestion-state]'); if (label && s && !s.applied) label.textContent = '正文已修改，建议基于旧版本';
    const apply = surface.querySelector('[data-apply-suggestion]'); if (apply && s) apply.disabled = s.applied || s.baseRevision !== d.revision;
    const compare = surface.querySelector('[data-compare-author]'); if (compare) compare.innerHTML = state.kind === 'long' ? d.html : esc(d.text);
    const status = surface.querySelector('[data-compare-status]'); if (status && s && s.baseRevision !== d.revision) status.textContent = '正文已有新改动，旧建议不能直接覆盖。';
  }
  function rememberSelection() { const selection = window.getSelection?.(), editor = surface.querySelector('[data-editor]'); if (selection?.rangeCount && editor?.contains(selection.anchorNode) && editor.contains(selection.focusNode)) savedRange = selection.getRangeAt(0).cloneRange(); }
  function format(command, value) {
    const editor = surface.querySelector('[data-editor]'); if (!editor || state.kind !== 'long') return;
    editor.focus(); const selection = window.getSelection?.();
    if (savedRange && editor.contains(savedRange.commonAncestorContainer)) { selection.removeAllRanges(); selection.addRange(savedRange); }
    const revision = currentDraft().revision;
    document.execCommand('styleWithCSS', false, false); document.execCommand(command, false, value ?? null); if (currentDraft().revision === revision) captureEditor(); rememberSelection();
  }
  async function copyDraft(kind = state.kind) {
    const draft = state.drafts[docKey(kind)], group = currentGroup(), g = currentGame();
    if (kind === 'short' && Array.from(draft.text).length >= 200) { state.copyReport = { status: '短评需少于 200 字，尚未复制。', text: '', fallback: false }; }
    else {
      const text = bodyForCopy(draft, kind) + (kind === 'long' ? `\n\n[hr]\n[url=https://steamcommunity.com/gid/${group.id}]${group.name}[/url]` : '');
      const report = { status: `正在复制 ${g.title} · ${kindName(kind)}…`, text, fallback: false }; state.copyReport = report;
      try { if (!window.navigator?.clipboard?.writeText) throw new Error(); await window.navigator.clipboard.writeText(text); report.status = `已复制 ${g.title} · ${kindName(kind)}${kind === 'long' ? '，含 Steam 排版和群组尾巴。' : '，仅正文。'}`; }
      catch { report.status = '当前预览没有剪贴板权限，可选中下面的文本手动复制。'; report.fallback = true; }
    }
    const output = surface.querySelector('[data-copy-result]'); if (output) output.innerHTML = copyResult();
  }
  surface.addEventListener('input', event => { if (event.target.closest('[data-editor]')) captureEditor(); if (event.target.matches('[data-full-url]')) state.urls[`${state.game}:${state.language}`] = event.target.value; });
  surface.addEventListener('mouseup', rememberSelection); surface.addEventListener('keyup', rememberSelection);
  surface.addEventListener('mousedown', event => { if (event.target.closest('[data-format],[data-action="format"],[data-action="block"]')) event.preventDefault(); });
  surface.addEventListener('copy', event => {
    const editor = event.target.closest?.('[data-editor]'), selection = window.getSelection?.(); if (!editor || state.kind !== 'long' || !selection?.rangeCount || selection.isCollapsed || !event.clipboardData) return;
    const range = selection.getRangeAt(0); if (!editor.contains(range.commonAncestorContainer)) return;
    let fragment = range.cloneContents(), ancestor = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentElement : range.commonAncestorContainer;
    while (ancestor && ancestor !== editor) { if (['STRONG','B','EM','I','U','S','H1','H2','H3','BLOCKQUOTE'].includes(ancestor.tagName)) { const wrap = document.createElement(ancestor.tagName.toLowerCase()); wrap.append(fragment); fragment = wrap; } ancestor = ancestor.parentElement; }
    const box = document.createElement('div'); box.append(fragment); event.clipboardData.setData('text/plain', [...box.childNodes].map(bbNode).join('').trim()); event.clipboardData.setData('text/html', safeHtml(box.innerHTML)); event.preventDefault();
  });
  surface.addEventListener('paste', event => { const editor = event.target.closest?.('[data-editor]'); if (!editor || !event.clipboardData) return; event.preventDefault(); const revision = currentDraft().revision; document.execCommand('insertText', false, event.clipboardData.getData('text/plain')); if (currentDraft().revision === revision) captureEditor(); });
  surface.addEventListener('click', event => {
    const link = event.target.closest('a'); if (link) event.preventDefault();
    const control = event.target.closest('button'); if (!control || control.disabled || control.dataset.resize) return;
    if (control.dataset.format) { format(control.dataset.format); return; }
    const action = control.dataset.action;
    if (action === 'format') { format(control.dataset.command); return; }
    if (action === 'block') { format('formatBlock', control.dataset.block); return; }
    if (action === 'copy') { copyDraft(control.dataset.kind || state.kind); return; }
    if (action === 'close-copy') { state.copyReport = null; const output = surface.querySelector('[data-copy-result]'); if (output) output.replaceChildren(); return; }
    if (action === 'game') { state.game = control.dataset.game; state.compare = false; state.history = false; state.copyReport = null; state.notice = ''; state.nativePreview = false; }
    if (action === 'tab') { state.tab = control.dataset.tab; state.compare = false; state.copyReport = null; state.notice = ''; state.nativePreview = false; }
    if (action === 'kind') { state.kind = control.dataset.kind; state.compare = false; state.history = false; state.copyReport = null; state.notice = ''; }
    if (action === 'sources') state.sourcesOpen = !state.sourcesOpen;
    if (action === 'source') state.source = control.dataset.source;
    if (action === 'generate') generateSuggestion();
    if (action === 'compare') state.compare = true;
    if (action === 'cancel-compare') state.compare = false;
    if (action === 'apply-suggestion') { const d = currentDraft(), s = state.suggestions[docKey()]; if (s && !s.applied && s.baseRevision === d.revision) { d.previous = { html: d.html, text: d.text }; d.text = s.text; d.html = state.kind === 'long' ? paragraphs(s.text) : esc(s.text); d.revision++; s.applied = true; state.compare = false; state.notice = '示例建议已应用，上一版作者正文已保留。'; } }
    if (action === 'history') state.history = !state.history;
    if (action === 'publication') { state.tab = 'publication'; state.compare = false; state.copyReport = null; }
    if (action === 'stop') state.running.delete(control.dataset.game);
    if (action === 'start') state.running.add(control.dataset.game);

    if (action === 'search') state.search = !state.search;
    if (action === 'account') state.account = !state.account;
    if (action === 'settings') state.settings = !state.settings;
    if (action === 'native-preview') state.nativePreview = true;
    if (action === 'native-cancel') state.nativePreview = false;
    if (action === 'native-apply') { const n = state.native[state.game]; state.nativePreview = false; n.unknown = scene.writeResult === 'unknown'; if (!n.unknown) n.unlocked = !n.unlocked; n.message = n.unknown ? '演示：未收到可确认结果，未自动重试；运行集合保持。' : '示例更改完成，其他游戏继续运行；真实写入仍待本人验收。'; }

  surface.addEventListener('change', event => { if (event.target.matches('[data-language]')) { state.language = event.target.value; state.compare = false; state.history = false; state.copyReport = null; state.notice = ''; render(); saveView(); } });
  surface.addEventListener('pointerdown', event => { const handle = event.target.closest('[data-resize]'); if (!handle) return; event.preventDefault(); const kind = handle.dataset.resize, value = Number(handle.getAttribute('aria-valuenow')); drag = { handle, kind, x: event.clientX, value, pointerId: event.pointerId }; handle.setPointerCapture?.(event.pointerId); });
  surface.addEventListener('pointermove', event => { if (!drag || event.pointerId !== drag.pointerId) return; const delta = event.clientX - drag.x; if (drag.kind === 'games') state.gamesWidth = Math.max(125, Math.min(280, drag.value + delta)); else state.sourceWidth = Math.max(180, Math.min(480, drag.value - delta)); applyWidths(); });
  function endDrag(event) { if (!drag || event.pointerId !== drag.pointerId) return; drag.handle.releasePointerCapture?.(event.pointerId); drag = null; saveView(); }
  surface.addEventListener('pointerup', endDrag); surface.addEventListener('pointercancel', endDrag);
  surface.addEventListener('keydown', event => { const handle = event.target.closest('[data-resize]'); if (!handle || !['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault(); const direction = event.key === 'ArrowRight' ? 20 : -20; if (handle.dataset.resize === 'games') state.gamesWidth = Math.max(125, Math.min(280, Number(handle.getAttribute('aria-valuenow')) + direction)); else state.sourceWidth = Math.max(180, Math.min(480, Number(handle.getAttribute('aria-valuenow')) - direction)); applyWidths(); saveView(); });

  restoreView(window.openai?.widgetState); render();
  window.addEventListener('openai:set_globals', event => { if (event.detail?.globals?.widgetState?.modelContent?.prototype === 'SteamCuratorHub #13 live-editor') { restoreView(event.detail.globals.widgetState); applyWidths(); } });

  if (globalThis.Tweak) { const tweak = new Tweak({ container: root, onChange: render }); tweak.addSelect(scene, 'writeResult', { label: '演示成就写入结果', options: [{ label: '完成', value: 'complete' }, { label: '结果未知', value: 'unknown' }] }); }
})();
</script>
