<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://shared.akamai.steamstatic.com https://shared.fastly.steamstatic.com https://cdn.akamai.steamstatic.com https://steamcdn-a.akamaihd.net; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Steam Curator Hub</title><link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script></head>
<body><div class="app-shell"><header class="app-header"><strong id="mode-label">Steam Curator Hub</strong><div class="actions"><div id="account-status"></div><button id="account-button">连接 Steam</button><button id="settings-button" data-tab="settings">设置</button></div></header><div id="connection-banner" role="status" aria-live="polite"></div><div class="workbench"><aside class="game-rail" aria-label="我的游戏"><div class="row-between"><h2>我的游戏</h2><button id="find-games" data-tab="library" class="small">查找游戏</button></div><label class="compact-task-picker">切换游戏<select id="task-picker" aria-label="当前任务"></select></label><div id="game-list"></div></aside><div id="rail-splitter"></div><div class="workspace"><header class="game-header"><div id="game-context"></div><label>文章语言<select id="language-picker" aria-label="文章语言"><option value="schinese">简体中文</option><option value="english">English</option></select></label></header><nav id="navigation" aria-label="当前游戏的功能"></nav><main id="main"><p>正在打开工作区…</p></main></div></div><section id="run-tray" aria-label="并行运行"></section><footer id="statusbar"></footer></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="modal-content"></div></dialog></body></html>
