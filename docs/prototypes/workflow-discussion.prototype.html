<!doctype html>
<!-- Three throwaway workflow variants on one standalone discussion page, switchable via ?variant=A|B|C. The rejected MVP shell is not reused. No network, credentials, backend or persistent state. -->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Steam Curator Hub · 第一轮交互讨论</title>
<style>
:root{color-scheme:light dark;font:15px/1.55 system-ui,-apple-system,sans-serif;--bg:light-dark(#f7f7f7,#171717);--fg:light-dark(#242424,#e7e7e7);--muted:light-dark(#5b5b5b,#b6b6b6);--line:light-dark(#bdbdbd,#5a5a5a);--panel:light-dark(#fff,#242424);--chosen:light-dark(#e6e6e6,#3e3e3e)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,textarea,select{font:inherit;color:inherit}button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.45rem .7rem;cursor:pointer}button[aria-pressed=true],button.primary{background:var(--fg);color:var(--bg)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:3px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:.5rem}textarea{min-height:110px;resize:vertical}h1,h2,h3,p{margin:0 0 .65rem}h1{font-size:1.35rem}h2{font-size:1.1rem}h3{font-size:1rem}small,.muted{color:var(--muted)}label{display:block;margin:.55rem 0}.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.between{justify-content:space-between}.stack>*+*{margin-top:.8rem}.label{display:inline-block;border:1px dashed var(--line);padding:.1rem .4rem;font-size:.82rem}.banner{padding:.8rem 1.4rem;border-bottom:1px dashed var(--line)}.shell{max-width:1450px;margin:auto;padding:1.3rem 1.4rem 7rem}.toolbar{margin:1rem 0}.account{border-bottom:1px solid var(--line);padding:1rem 0}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:1.5rem;margin-top:1.2rem}.wide-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:1.4rem}.game-list{display:grid;gap:.6rem}.game-list button{text-align:left;display:block;width:100%}.game-list span{display:block}.panel{background:var(--panel);border:1px solid var(--line);padding:1rem;min-width:0}.subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}.lane{border-top:3px solid var(--line);padding-top:.8rem;min-width:0}.lane button{width:100%;text-align:left;margin-top:.7rem}.lane small{display:block}.focus{margin-top:1rem}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;padding:.7rem 0}.facts strong,.facts small{display:block}.notice{border-left:4px solid var(--fg);padding:.6rem .8rem;background:var(--chosen);margin:.8rem 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{padding:.65rem .4rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}td button{margin:.15rem}th{white-space:nowrap}.switcher{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);max-width:calc(100% - 1.5rem);border:2px solid var(--fg);background:var(--panel);padding:.65rem;display:flex;gap:.65rem;align-items:center;z-index:5;box-shadow:0 3px 12px #0003}.switcher span{min-width:12rem;text-align:center}#feedback{min-height:1.6rem;margin:.7rem 0}details{margin-top:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}.flow{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0}.flow span{border-bottom:1px solid var(--line);padding:.2rem .3rem}.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.topline{font-size:.86rem;letter-spacing:.04em}.auth-progress{display:flex;flex-wrap:wrap;gap:.5rem}.auth-progress strong{border-bottom:2px solid var(--fg)}@media(max-width:1050px){.wide-layout{grid-template-columns:1fr}.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{padding:1rem .8rem 8rem}.banner{padding:.7rem .8rem}.layout{grid-template-columns:1fr}.game-list{grid-template-columns:1fr 1fr}.grid,.split{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.switcher span{min-width:0}.lanes{grid-template-columns:1fr 1fr}button{min-height:42px}.game-list button{min-width:0}}
</style>
<body>
<div class="banner"><div class="row between"><strong>第一轮交互讨论 · 未确认方案</strong><span class="label">低保真 / 全部为合成演示</span></div><small>本轮只比较工作如何组织。与当前 MVP 界面独立；不连接 Steam、不写入成就、不调用 API、不发布或保存真实数据。</small></div>
<main class="shell">
<header><div class="topline">STEAM CURATOR HUB</div><h1 id="variant-title"></h1><p id="variant-question" class="muted"></p></header>
<div class="toolbar row between"><div class="row" id="variant-options"></div><label class="row">情境<select id="scenario" style="width:auto"><option value="ready">正常使用</option><option value="guard">等待 Steam Guard</option><option value="disconnect">运行中断线</option><option value="unknown">成就写入结果未知</option><option value="conflict">草稿版本冲突</option></select></label></div>
<section id="account" class="account" aria-label="账号和连接"></section>
<div id="feedback" role="status" aria-live="polite"></div>
<section id="view" aria-label="方案预览"></section>
<details><summary>当前演示状态与本轮讨论范围</summary><p class="muted">切换方案共享同一组演示数据。刷新恢复初始状态；方案字母保留在地址中。所有成功/失败按钮只改变演示状态。本轮不确认视觉风格、正式尾巴、字符边界规则或平台兼容性。</p><pre id="state"></pre></details>
</main>
<nav class="switcher" aria-label="切换讨论方案"><button id="previous" aria-label="上一个方案">←</button><span id="variant-label"></span><button id="next" aria-label="下一个方案">→</button></nav>
<script>
'use strict';
const variants={A:{name:'以游戏为中心',question:'先选一款游戏，运行、成就、资料与稿件围绕同一个游戏展开。'},B:{name:'多游戏并行总览',question:'先看全部运行与待处理事项，在同一工作台处理某款游戏。'},C:{name:'按评测进度组织',question:'先看评测推进到哪一步，再进入该游戏；运行状态始终独立可见。'}};
const initialGames=()=>[
{id:1001,name:'星海旅人',group:'浮生评测',groupId:'45134494',stage:'research',run:true,minutes:132,elapsed:18,stats:'ready',achievement:false,long:'探索与叙事互相呼应，后段节奏仍有打磨空间。\n\n这是一段合成评测，用于讨论编辑流程。',short:'探索与叙事相互呼应，适合希望慢下来发掘细节的玩家。',link:'',research:'empty',publication:'none',shortPublication:'none',draftConflict:false},
{id:1002,name:'雾港纪事',group:'桃你欢心',groupId:'45525570',stage:'publish',run:true,minutes:256,elapsed:9,stats:'ready',achievement:true,long:'合成示例：围绕港口展开的悬疑故事。',short:'围绕港口展开的悬疑故事，线索组织清楚，推进节奏偏慢。',link:'',research:'collected',publication:'prepared',shortPublication:'none',draftConflict:false},
{id:1003,name:'纸上花园',group:'浮生评测',groupId:'45134494',stage:'find',run:false,minutes:0,elapsed:0,stats:'ready',achievement:false,long:'',short:'',link:'',research:'empty',publication:'none',shortPublication:'none',draftConflict:false}];
let variant=Object.hasOwn(variants,new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
let games=initialGames(),selected=1001,section='work',auth='connected',message='',clicks=0,publishKind='long';
const $=id=>document.getElementById(id),escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>games.find(g=>g.id===selected),active=()=>games.filter(g=>g.run).length;
const btn=(label,action,extra='',disabled=false)=>`<button type="button" data-action="${action}" ${extra} ${disabled?'disabled':''}>${label}</button>`;
const runLabel=g=>g.run?'模拟运行中':'未运行';
const stateLabel=g=>({ready:'可读取与预览',preview:'等待确认修改',verified:'合成回读匹配',unknown:'结果未知，先回读核对'}[g.stats]);
const publicationLabel=(g,kind='long')=>({none:'尚未准备',prepared:'已冻结内容，尚未填表',filled:'已演示填入，等待本人提交',unknown:'提交结果待核实',confirmed:'本人确认（演示）',verified:'应用回读匹配（演示）'}[kind==='short'?g.shortPublication:g.publication]);
function gameList(){return `<div class="game-list">${games.map(g=>`<button type="button" data-select="${g.id}" aria-pressed="${g.id===selected}"><strong>${g.name}</strong><span>${g.group}</span><small>${runLabel(g)} · Steam ${g.minutes} 分钟（合成）</small></button>`).join('')}</div>`;}
function gameHeading(g){return `<div class="row between"><div><h2>${g.name}</h2><small>AppID ${g.id} · ${g.group}（${g.groupId}）· 唯一投稿群组</small></div><span class="label">${runLabel(g)}</span></div>`;}
function tabs(){return `<nav class="subnav" aria-label="当前游戏工作"><button data-section="work" aria-pressed="${section==='work'}">运行与成就</button><button data-section="write" aria-pressed="${section==='write'}">资料与写作</button><button data-section="publish" aria-pressed="${section==='publish'}">发布准备</button></nav>`;}
function work(g){return `<div class="grid"><section class="panel"><h3>本次运行</h3><div class="facts"><div><small>Steam 累计（合成）</small><strong>${g.minutes} 分钟</strong></div><div><small>本机计时（合成）</small><strong>${g.elapsed} 分钟</strong></div><div><small>本次结束条件</small><strong>再运行 30 分钟</strong></div></div><p class="muted">累计目标与本次期限分别设置。单独停止这款游戏，其他运行继续。</p><div class="row">${btn(g.run?'停止本游戏':'开始本游戏','run',`class="primary"`,auth!=='connected')}${btn('模拟回读增长','readback','',!g.run)}</div></section><section class="panel"><h3>成就与统计</h3><p>当前：${stateLabel(g)}</p><p>首次探索：${g.achievement?'已解锁':'未解锁'} · 探索次数：7（INT，合成）</p><p class="muted">可在本游戏或其他游戏运行时操作。先预览修改，再提交；结果未知时先核实。</p><div class="row">${btn('读取 / 刷新','stats-read')}${btn('预览切换成就','stats-preview','',g.stats==='unknown')}${g.stats==='preview'?btn('确认演示修改','stats-apply','class="primary"'):''}${g.stats==='unknown'?btn('回读并确认已核对','stats-reconcile','class="primary"'):''}</div></section></div>`;}
function write(g){return `<div class="split"><section class="panel"><h3>资料与建议</h3><p>${g.research==='empty'?'尚未整理资料':g.research==='collected'?'合成资料已整理；来源与观点分开保留':'合成建议已生成，作者草稿未改变'}</p><p class="muted">按游戏名查找 Steam 评论与媒体，取得正文后再生成。失败或不足明确显示。</p><div class="row">${btn('演示整理资料','research')}${btn('生成建议','suggestion','',g.research==='empty')}</div>${g.research==='suggested'?`<blockquote>建议：探索节奏值得关注，同时应交代后段重复感。<br>${btn('应用为长评新版本','suggestion-apply')}</blockquote>`:''}</section><section class="panel"><h3>作者稿件 · 简体中文</h3>${g.draftConflict?'<div class="notice">草稿版本已变化；保留本地文字，选择如何合并后再保存。</div>':''}<label>个人长评（正文）<textarea data-field="long">${escape(g.long)}</textarea></label><small>群组尾巴独立保存，在长评预览与发布准备时组合一次。</small><label>鉴赏家短评<textarea data-field="short" id="short-text">${escape(g.short)}</textarea></label><small id="short-count">${Array.from(g.short).length} / 199 个码点；正文不加尾巴或链接（当前工程默认）</small><label>全文链接（独立字段）<input data-field="link" value="${escape(g.link)}" placeholder="当前账号与游戏的 Steam 个人评测 URL"></label><div class="row">${btn('演示保存稿件','save','class="primary"',g.draftConflict)}${g.draftConflict?btn('保留本地稿并处理冲突','resolve'):''}${btn('去发布准备','to-publish')}</div></section></div>`;}
function publish(g){const state=publishKind==='short'?g.shortPublication:g.publication;const name=publishKind==='short'?'鉴赏家短评':'个人长评';return `<section class="panel"><h3>分别准备长评与短评</h3><div class="row">${btn('个人长评','publication-kind','data-kind="long" aria-pressed="'+(publishKind==='long')+'"')}${btn('鉴赏家短评','publication-kind','data-kind="short" aria-pressed="'+(publishKind==='short')+'"')}</div><div class="facts"><div><small>目标游戏</small><strong>${g.name}</strong></div><div><small>唯一鉴赏组</small><strong>${g.group}</strong></div><div><small>当前${name}记录</small><strong>${publicationLabel(g,publishKind)}</strong></div></div><div class="flow"><span>冻结内容与目标</span><span>→ 核对网页账号与字段</span><span>→ 辅助填表</span><span>→ 本人提交</span><span>→ 各自核实结果</span></div><p>个人长评：正文 + 当前群组尾巴。鉴赏家短评：仅摘要；全文链接填入单独字段。</p><p class="muted">网页发布账号、本机 Steam 客户端账号各自核对。填表和点击提交不等于发布成功；结果未知时先查询。</p><div class="row">${btn('冻结'+name+'演示快照','prepare','class="primary"',['filled','unknown','confirmed','verified'].includes(state))}${btn('演示核对与填表','fill','',state!=='prepared')}${btn('演示已提交、结果未知','submitted','',state!=='filled')}${btn('演示本人确认','manual','',!['filled','unknown'].includes(state))}${publishKind==='long'?btn('演示长评回读匹配','verify','',!['filled','unknown','confirmed'].includes(state)):''}</div><p class="notice">长评结果与短评结果独立记账。这里的按钮只演示不同结果来源，不会打开或提交真实页面。</p><dl><dt>长评</dt><dd>${publicationLabel(g)}</dd><dt>短评</dt><dd>${publicationLabel(g,'short')}</dd></dl></section>`;}
function content(g){return section==='work'?work(g):section==='write'?write(g):publish(g);}
function variantA(){const g=current();return `<div class="layout"><aside><h2>选择游戏</h2>${gameList()}<p class="muted">切换游戏同时切换任务、成就与稿件归属。</p></aside><article class="stack">${gameHeading(g)}${tabs()}${content(g)}</article></div>`;}
function variantB(){const g=current();return `<div class="wide-layout"><section><h2>并行运行 · ${active()} 款</h2><div class="table-wrap"><table><thead><tr><th>游戏 / 投稿群组</th><th>运行与累计时长</th><th>操作</th></tr></thead><tbody>${games.map(row=>`<tr><td><strong>${row.name}</strong><br><small>${row.group}</small></td><td>${runLabel(row)}<br><small>Steam ${row.minutes} 分钟（合成）</small></td><td>${btn(row.run?'单独停止':'单独开始','run-row',`data-game="${row.id}"`,auth!=='connected')}${btn('处理此游戏','focus-row',`data-game="${row.id}"`)}</td></tr>`).join('')}</tbody></table></div><div class="focus stack">${gameHeading(g)}${tabs()}${content(g)}</div></section><aside class="panel stack"><h2>需要处理</h2><p>星海旅人：成就修改与运行可以同时进行。</p><p>雾港纪事：长短评等待核对与提交。</p><p>纸上花园：待整理资料。</p><h3>快速切换游戏</h3>${gameList()}<small>长短评记录按游戏保留；不会因切换选中项而改变运行集合。</small></aside></div>`;}
function variantC(){const g=current();const stages=[['find','已加入 / 待整理'],['research','资料与写作'],['publish','准备发布 / 待核实'],['done','已人工标记完成']];return `<section><div class="row between"><h2>评测进度</h2><span class="label">评测阶段与 Steam 运行独立</span></div><div class="lanes">${stages.map(([key,label])=>`<section class="lane"><h3>${label}</h3>${games.filter(row=>row.stage===key).map(row=>`<button data-select="${row.id}" aria-pressed="${row.id===selected}"><strong>${row.name}</strong><small>${row.group} · ${runLabel(row)}</small><small>${publicationLabel(row)}</small></button>`).join('')||'<small>暂无任务</small>'}</section>`).join('')}</div><div class="panel focus row between"><span>独立运行条：${games.filter(row=>row.run).map(row=>row.name).join('、')||'无活动运行'}</span><div class="row">${games.filter(row=>row.run).map(row=>btn(`停止 ${row.name}`,'run-row',`data-game="${row.id}"`)).join('')}</div></div><article class="stack focus">${gameHeading(g)}<div class="row"><label>评测阶段<select id="stage">${stages.map(([key,label])=>`<option value="${key}" ${g.stage===key?'selected':''}>${label}</option>`).join('')}</select></label><small>手动推进阶段不改变 Steam 时长或发布结果。</small></div>${tabs()}${content(g)}</article></section>`;}
function render(){const v=variants[variant];$('variant-title').textContent=`${variant} · ${v.name}`;$('variant-question').textContent=v.question;$('variant-label').textContent=`${variant} — ${v.name}`;$('variant-options').innerHTML=Object.entries(variants).map(([key,value])=>`<button data-variant="${key}" aria-pressed="${key===variant}">${key} · ${value.name}</button>`).join('');const status={connected:'已连接（演示）',guard:'等待 Steam Guard（演示）',reconnecting:'有界重连中，运行未恢复（演示）',logged_out:'未连接（演示）'}[auth];$('account').innerHTML=`<div class="row between"><div><strong>Steam 账号：示例账号 · ${status}</strong><br><small>工作区归属：示例账号；网页发布身份待核对；本机 Steam 客户端身份待核对</small></div><div class="row">${btn('演示登录过程','auth-start')}${auth==='guard'?btn('演示 Guard 完成','auth-complete','class="primary"'):''}${auth==='reconnecting'?btn('演示连接恢复','auth-complete','class="primary"'):''}${btn('退出连接','auth-logout')}</div></div>${auth==='guard'?'<div class="auth-progress"><span>已提交账号</span><strong>本人完成验证</strong><span>等待连接确认</span></div>':''}`;$('view').innerHTML=variant==='A'?variantA():variant==='B'?variantB():variantC();$('feedback').textContent=message;$('state').textContent=JSON.stringify({方案:variant,选择游戏:selected,当前区域:section,演示连接:auth,发布类型:publishKind,演示操作次数:clicks,游戏:games},null,2);}
function changeVariant(value){variant=value;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);message='已切换组织方案，演示数据保持不变。';render();}
function cycle(direction){const keys=Object.keys(variants);changeVariant(keys[(keys.indexOf(variant)+direction+keys.length)%keys.length]);}
document.addEventListener('click',event=>{const node=event.target.closest('button');if(!node||node.disabled)return;if(node.dataset.variant)return changeVariant(node.dataset.variant);if(node.dataset.select){selected=Number(node.dataset.select);clicks++;message='已切换所选游戏；其他游戏继续原有状态。';return render();}if(node.dataset.section){section=node.dataset.section;clicks++;return render();}const action=node.dataset.action;if(!action)return;clicks++;const g=node.dataset.game?games.find(row=>row.id===Number(node.dataset.game)):current();message='';switch(action){case'run':case'run-row':g.run=!g.run;message=`${g.name} ${g.run?'已演示开始':'已演示单独停止'}；当前 ${active()} 款运行。`;break;case'focus-row':selected=g.id;section='work';break;case'readback':g.minutes+=2;message='演示收到新的 Steam 读数；本机计时不作为 Steam 增长证据。';break;case'stats-read':message='已演示读取成就与统计；正在运行的游戏不受影响。';break;case'stats-preview':g.stats='preview';message='演示修改预览：首次探索成就切换状态。';break;case'stats-apply':g.achievement=!g.achievement;g.stats='verified';message='合成写入与回读完成；真实结果仍需本人验证。';break;case'stats-reconcile':g.stats='ready';message='演示完成独立回读并确认已核对，可重新准备新修改。';break;case'research':g.research='collected';message='已加入合成 Steam 评论和媒体摘录；不代表已访问真实来源。';break;case'suggestion':g.research='suggested';break;case'suggestion-apply':g.long='探索节奏值得关注，同时应交代后段重复感。';message='演示建议成为作者稿件的新版本。';break;case'save':message='稿件在本页内存中保留；刷新会恢复合成初始值。';break;case'resolve':g.draftConflict=false;message='本地文字保留，演示进入合并后的版本。';break;case'to-publish':section='publish';break;case'publication-kind':publishKind=node.dataset.kind;break;case'prepare':if(publishKind==='short')g.shortPublication='prepared';else g.publication='prepared';message='已演示冻结目标、稿件和语言；尚未发布。';break;case'fill':if(publishKind==='short')g.shortPublication='filled';else g.publication='filled';message='已演示填表，提交由本人决定。';break;case'submitted':if(publishKind==='short')g.shortPublication='unknown';else g.publication='unknown';message='提交结果未知，先核实；重复准备已阻止。';break;case'manual':if(publishKind==='short')g.shortPublication='confirmed';else g.publication='confirmed';message='本条记录为本人确认，不改变另一条评测结果。';break;case'verify':g.publication='verified';message='仅长评演示应用回读匹配；短评结果保持原样。';break;case'auth-start':auth='guard';games.forEach(row=>row.run=false);message='登录账号、阶段与验证持续可见。';break;case'auth-complete':auth='connected';message='演示连接恢复；已中断的游戏不会自动续跑。';break;case'auth-logout':auth='logged_out';games.forEach(row=>row.run=false);message='演示退出连接并停止全部请求；稿件保留。';break;}render();});
document.addEventListener('input',event=>{const field=event.target.dataset.field;if(!field)return;current()[field]=event.target.value;if(field==='short')$('short-count').textContent=`${Array.from(current().short).length} / 199 个码点；正文不加尾巴或链接（当前工程默认）`;$('state').textContent=JSON.stringify({方案:variant,选择游戏:selected,当前区域:section,演示连接:auth,发布类型:publishKind,演示操作次数:clicks,游戏:games},null,2);});
document.addEventListener('change',event=>{if(event.target.id==='stage'){current().stage=event.target.value;message='只更新演示评测阶段；不会改变任何时长或发布事实。';clicks++;render();}});
$('scenario').addEventListener('change',event=>{games=initialGames();selected=1001;auth='connected';section='work';const mode=event.target.value;if(mode==='guard'){auth='guard';games.forEach(g=>g.run=false);message='同一上下文显示账号、验证阶段和可取消状态。';}else if(mode==='disconnect'){auth='reconnecting';games.forEach(g=>g.run=false);message='连接尝试 1 / 3。原运行结果未知；恢复认证不会自动续跑。';}else if(mode==='unknown'){current().stats='unknown';message='保留成就写入未知状态；原运行继续；新写入需先回读核对。';}else if(mode==='conflict'){current().draftConflict=true;section='write';message='保存冲突保留本地稿，不覆盖另一版本。';}else message='正常情境：两款游戏并行，成就操作可同时进行。';render();});
$('previous').addEventListener('click',()=>cycle(-1));$('next').addEventListener('click',()=>cycle(1));document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]')||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);}});window.addEventListener('popstate',()=>{const key=new URLSearchParams(location.search).get('variant');if(Object.hasOwn(variants,key)){variant=key;render();}});render();
</script>
</body></html>
